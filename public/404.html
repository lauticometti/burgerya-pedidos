<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      (function () {
        // El sitio se sirve en la raiz del dominio (burgerya.com.ar), no en
        // un subpath de GitHub Pages: no hay que adivinar/recortar ningun
        // segmento de proyecto, solo redirigir la ruta tal cual.
        var l = window.location;
        var path = l.pathname.slice(1);
        var search = l.search ? l.search.replace(/&/g, "~and~") : "";
        var redirect = "/?/" + path + search + l.hash;
        l.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
